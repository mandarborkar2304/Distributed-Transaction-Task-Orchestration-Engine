version: '3.8'

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orchestrator
    command: postgres -c max_connections=500 -c shared_buffers=256MB -c effective_cache_size=768MB
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.50.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - gateway
      - python-api

  # ── Go Gateway (high-throughput ingestion) ──────────────────────────────────
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile.gateway
      target: gateway
    image: orchestrator-gateway:latest
    environment:
      DATABASE_DSN: "postgres://postgres:postgres@postgres:5432/orchestrator"
      REDIS_ADDR: "redis:6379"
      GATEWAY_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Go Worker (SKIP LOCKED task consumer) ──────────────────────────────────
  go-worker:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile.gateway
      target: worker
    image: orchestrator-worker:latest
    environment:
      DATABASE_DSN: "postgres://postgres:postgres@postgres:5432/orchestrator"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  # ── Python API (retained for specialised handlers & backwards-compat) ────────
  python-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/orchestrator"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
